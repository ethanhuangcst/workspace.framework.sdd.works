name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: framework_sdd
          POSTGRES_PASSWORD: framework_sdd
          POSTGRES_DB: framework_sdd
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U framework_sdd -d framework_sdd"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://framework_sdd:framework_sdd@localhost:5435/framework_sdd
      SESSION_SECRET: ci-session-secret-at-least-16
      PUBLIC_BASE_URL: http://localhost:3040
      APP_NAME: framework.sdd.works
      ADMIN_SEED_EMAIL: me@ethanhuang.com
      ADMIN_SEED_USERNAME: admin
      ADMIN_SEED_PASSWORD: Sprint1Pass!
      E2E_RESET_FILE: /tmp/sdd-reset-url.txt
      E2E_INVITE_FILE: /tmp/sdd-invite-url.txt
      E2E_ADMIN_PASSWORD: Sprint1Pass!

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
